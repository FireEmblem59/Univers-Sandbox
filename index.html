<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Orbital Engine v2</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <!-- Google Fonts for that sci-fi look -->
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <!-- START MENU / SCENE SELECTOR -->
    <div id="startMenu" class="overlay-menu">
      <h1>ORBITAL ENGINE</h1>
      <div class="menu-grid">
        <button class="preset-btn" data-preset="empty">Void (Empty)</button>
        <button class="preset-btn" data-preset="solar">Solar System</button>
        <button class="preset-btn" data-preset="binary">Binary Star</button>
        <button class="preset-btn" data-preset="chaos">N-Body Chaos</button>
      </div>
    </div>

    <!-- LEFT SIDEBAR: OBJECT LIST -->
    <div id="objectListPanel" class="sidebar left">
      <h3>Objects (<span id="objCount">0</span>)</h3>
      <ul id="objectList"></ul>
    </div>

    <!-- RIGHT SIDEBAR: INSPECTOR & SETTINGS -->
    <div id="inspectorPanel" class="sidebar right">
      <!-- SELECTION INFO -->
      <div id="selectionInfo" class="hidden">
        <h3>Selection</h3>
        <div class="prop-row">
          <span>Type:</span> <span id="selType">--</span>
        </div>
        <div class="prop-row">
          <span>Mass:</span> <span id="selMass">--</span>
        </div>
        <div class="prop-row">
          <span>Vel:</span> <span id="selVel">--</span>
        </div>
        <div class="action-row">
          <button id="btnStop" class="small-btn">Stop</button>
          <button id="btnDel" class="small-btn danger">Delete</button>
        </div>
        <hr />
      </div>

      <h3>Time Control</h3>
      <div class="setting-group">
        <label
          >Speed:
          <span id="timeVal" style="color: #00aaff; font-weight: bold"
            >×1</span
          ></label
        >
        <input
          type="range"
          id="timeSlider"
          min="0"
          max="10"
          step="0.1"
          value="1"
        />
        <!-- Visual markers for common speeds -->
        <div class="slider-markers">
          <span>Stop</span>
          <span>1x</span>
          <span>5x</span>
          <span>10x</span>
        </div>
      </div>

      <!-- GLOBAL SETTINGS -->
      <h3>Tool Settings</h3>
      <div class="setting-group">
        <label>Mass: <span id="valPlanetMass">50</span></label>
        <input
          type="range"
          id="inPlanetMass"
          min="10"
          max="500"
          step="10"
          value="50"
        />
      </div>
      <div class="setting-group">
        <label>Zoom Limit</label>
        <input type="range" id="inMaxZoom" min="2" max="20" value="5" />
      </div>

      <div class="action-row">
        <button id="btnSave">Save Scene</button>
        <button id="btnLoad">Load Scene</button>
        <input type="file" id="fileInput" style="display: none" />
      </div>
    </div>

    <!-- BOTTOM UI -->
    <div class="ui">
      <div class="toolbar">
        <div class="mode-group">
          <button id="planetBtn" class="tool-btn">Planet</button>
          <div class="options" id="planetOptions">
            <button data-behavior="orbit">Orbit</button>
            <button data-behavior="vector">Vector</button>
            <button data-behavior="free">Still</button>
          </div>
        </div>
        <div class="mode-group">
          <button id="sunBtn" class="tool-btn">Sun</button>
          <div class="options" id="sunOptions">
            <button data-behavior="vector">Vector</button>
            <button data-behavior="static">Static</button>
            <button data-behavior="massive">Black Hole</button>
          </div>
        </div>

        <button id="selectBtn" class="tool-btn active-tool">Select</button>
        <!-- NEW -->

        <div class="separator"></div>
        <button id="recenterBtn">Recenter</button>
        <button id="trailsBtn" class="active">Trails</button>
        <button id="lagrangeBtn">L-Points</button>
        <!-- NEW -->
      </div>
      <div id="status" class="status-text">Select Mode</div>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
